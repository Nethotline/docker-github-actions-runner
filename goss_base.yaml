package:
    curl:
        installed: true
    docker:
        installed: false
    docker-compose:
        installed: false
    git:
        installed: true
    git-lfs:
        installed: false
    jq:
        installed: true
    libyaml-dev:
        installed: true
    lsb-release:
        installed: true
    make:
        installed: true
    pwsh:
        installed: false
    python3:
        installed: true
    rsync:
        installed: true
    ssh:
        installed: false
    sudo:
        installed: true
    tar:
        installed: true
    unzip:
        installed: true
    wget:
        installed: true
    yq:
        installed: false
    # Ubuntu Focal is the only one currently that doesnt have an official upstream skopeo/buildah/podman
    {{ if not (eq .Vars.oscodename "focal") }}
    skopeo:
        installed: true
    buildah:
        installed: true
    podman:
        installed: true
    {{ end }}
    # Playwright/Chromium system deps baked for the [self-hosted, e2e] runner
    # (SeTaFo1 #1259). These names are stable across every release in the matrix.
    libnss3:
        installed: true
    libgbm1:
        installed: true
    libxkbcommon0:
        installed: true
    fonts-liberation:
        installed: true
    # A t64-renamed lib proves the OS-aware probe in build/tools.sh picked the
    # right name: noble/trixie ship `t64`, older releases keep the legacy name.
    {{ if or (eq .Vars.oscodename "noble") (eq .Vars.oscodename "trixie") }}
    libasound2t64:
        installed: true
    {{ else }}
    libasound2:
        installed: true
    {{ end }}
file:
  /usr/bin/gh:
    exists: true
  # NodeSource ships `node`/`npm` under /usr/bin (Ubuntu's package used
  # /usr/bin/nodejs). See build/sources.sh:configure_nodejs.
  /usr/bin/node:
    exists: true
  /usr/bin/npm:
    exists: true
  /usr/sbin/gosu:
    exists: true
  /usr/bin/dumb-init:
    exists: true
  /etc/init.d/docker:
    exists: true
    owner: root
    group: root
    filetype: file
    contents:
      - /^\s*# ulimit -Hn/
  /etc/sudoers:
    exists: true
    owner: root
    group: root
    filetype: file
    contents:
      - '/%sudo ALL=\(ALL\) NOPASSWD: ALL/'
      - '/Defaults env_keep = "HTTP_PROXY HTTPS_PROXY NO_PROXY FTP_PROXY http_proxy https_proxy no_proxy ftp_proxy"/'
  /etc/locale.gen:
    exists: true
    owner: root
    group: root
    filetype: file
    contents:
      - '/^en_US.UTF-8 UTF-8/'
  # Temurin JDK 21 + Android SDK (platform-tools, android-36, build-tools 36.0.0)
  # are baked for x86_64 only — the linux SDK binaries are x86_64.
  # Keep these paths in lockstep with install_android-sdk() in build/tools.sh:
  # the runner user cannot write /opt/android-sdk, so a platform missing from the
  # image is a hard build failure downstream, not a slow first build.
  {{ if eq .Vars.arch "x86_64" }}
  /opt/java/bin/java:
    exists: true
  /opt/android-sdk/platform-tools/adb:
    exists: true
  /opt/android-sdk/platforms/android-36/android.jar:
    exists: true
  /opt/android-sdk/build-tools/36.0.0/aapt2:
    exists: true
  {{ end }}

user:
    runner:
        exists: true
        uid: 1001
        gid: 121
        groups:
            - runner
            - sudo
            - docker
group:
    runner:
        exists: true
        gid: 121
    docker:
        exists: true
        gid: 500
command:
    # Guards the NodeSource pin in build/sources.sh — the runner's default node
    # must stay modern (npm 11 needs >= 20.17 / 22.9; Ubuntu noble's default is 18).
    node --version:
        exit-status: 0
        stdout:
            - /^v24\./
